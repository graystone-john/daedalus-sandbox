name: Demo Validation

on:
  push:
    branches: [main, 'daedalus/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Dashboard browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install browser testing tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install playwright==1.56.0
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Check dashboard
        run: .venv/bin/python tests/check_demo.py

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
